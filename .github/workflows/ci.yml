name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: Engine tests, detekt, benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Test and benchmark
        run: ./gradlew :engine:test :engine:detekt :engine:benchmark --no-daemon
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-benchmarks
          path: |
            engine/build/reports/benchmarks/results.md
            docs/images/matching-comparison.png
          if-no-files-found: warn

  android:
    name: Android lint and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Configure release signing when secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret. Release artifacts will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Lint, detekt, debug and release packages
        run: ./gradlew :app:detekt :app:lintDebug :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  instrumented:
    name: Room instrumented test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon

  publish-debug-apk:
    name: Publish debug APK
    needs: [engine, android, instrumented]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/cursor/collage-tuning-loop-fcee' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prerelease tag for this version
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_ENV"
          echo "tag=v${version}-dev" >> "$GITHUB_ENV"
      - name: Point the prerelease tag at this commit
        run: git push --force origin "$GITHUB_SHA:refs/tags/${tag}"
      - uses: actions/download-artifact@v4
        with:
          name: android-packages
          path: packages
      - name: Attach the debug APK to the prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          target_commitish: ${{ github.sha }}
          name: Mosaic ${{ env.version }}-dev
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            Debug build of ${{ github.sha }}. Same-source copies may be flipped, rotated, and resized, and they must not touch. Target outlines are kept with edge subdivision and a light ink pass.
          files: packages/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
